<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="container">

        <h2>Register</h2>

        <div class="form-group">

            <!-- Email -->
            <input
                type="email"
                id="email"
                placeholder="Email"
            />

            <!-- Password -->
            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                />

                <button
                    type="button"
                    class="eye-btn"
                    onclick="togglePassword()"
                >

                    <!-- Open Eye -->
                    <svg
                        id="eyeOpen"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                    >
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>

                    <!-- Closed Eye -->
                    <svg
                        id="eyeClosed"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        style="display:none;"
                    >
                        <path d="M3 3l18 18" />
                        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                        <path d="M9.9 4.2A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8s-3.5 8-10 8c-1.8 0-3.4-.5-4.8-1.2" />
                        <path d="M6.6 6.6C3.7 8.5 2 12 2 12s1.2 2.7 3.5 4.8" />
                    </svg>

                </button>

            </div>

        </div>

        <button onclick="register()">Register</button>

        <p>
            Already have an account?
            <a href="login.html">Login here</a>
        </p>

    </div>

    <script src="script.js"></script>

</body>

</html>
