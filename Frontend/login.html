<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · My Diary</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="auth-wrap">
        <div class="auth-card">
            <span class="auth-mark">📖</span>
            <h1>My Diary</h1>
            <p class="auth-sub">Welcome back. Pick up where you left off.</p>

            <form onsubmit="event.preventDefault(); login();">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"
                            required />
                        <button type="button" class="password-toggle" aria-pressed="false" aria-label="Show password"
                            aria-controls="password" onclick="togglePassword(this)">
                            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                                <line x1="1" y1="1" x2="23" y2="23" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Sign in</button>
            </form>

            <p class="auth-alt">
                New here? <a href="register.html">Create an account</a>
            </p>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>

</html>
