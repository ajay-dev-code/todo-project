<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Diary</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <h1>My Diary</h1>
                <span class="today" id="today"></span>
            </div>
            <button class="btn btn-ghost" onclick="logout()">Sign out</button>
        </div>
    </header>

    <main class="page">
        <!-- Composer -->
        <section class="composer">
            <h2 id="composer-title">New entry</h2>

            <div class="field">
                <label for="entry-title">Title</label>
                <input type="text" id="entry-title" placeholder="A quiet Sunday" />
            </div>

            <div class="field">
                <label for="entry-date">Date</label>
                <input type="date" id="entry-date" />
            </div>

            <div class="field">
                <label>Mood</label>
                <div class="moods" id="moods"></div>
            </div>

            <div class="field">
                <label for="entry-content">Entry</label>
                <textarea id="entry-content" rows="8" placeholder="How was your day?"></textarea>
            </div>

            <div class="composer-actions">
                <button class="btn btn-primary" id="save-btn" onclick="saveEntry()">Save entry</button>
                <button class="btn btn-ghost" id="cancel-btn" onclick="resetComposer()" hidden>Cancel</button>
            </div>
        </section>

        <!-- Feed -->
        <section>
            <div class="feed-head">
                <h2>Entries <span class="count" id="entry-count"></span></h2>
                <input type="text" id="search" placeholder="Search entries…" oninput="renderEntries()" />
            </div>

            <div class="entries" id="entries">
                <div class="state"><span class="state-mark">📖</span><strong>Opening your diary…</strong></div>
            </div>
        </section>
    </main>

    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>

</html>
